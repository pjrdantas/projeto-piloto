# ========================================================
# 1. Deployment do Projeto Piloto (Spring Boot)
# ========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projeto-piloto
spec:
  replicas: 3
  selector:
    matchLabels:
      app: projeto-piloto
  template:
    metadata:
      labels:
        app: projeto-piloto
    spec:
      containers:
        - name: projeto-piloto
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/projeto-piloto:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://SEU_RDS:5432/postgres"

            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password

---
# ========================================================
# Service do Spring Boot
# ========================================================
apiVersion: v1
kind: Service
metadata:
  name: projeto-piloto-svc
spec:
  type: ClusterIP
  selector:
    app: projeto-piloto
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
# ========================================================
# 2. Deployment do Nginx (Proxy)
# ========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: nginx-proxy-config
          configMap:
            name: nginx-conf

---
# ========================================================
# Service do Nginx (LoadBalancer)
# ========================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80