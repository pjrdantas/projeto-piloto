name: CI/CD Pipeline

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - run: mvn -B clean verify

  sonarcloud:
    name: SonarCloud Scan + Quality Gate
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build (required for analysis)
        run: mvn -B clean verify

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e
          mvn -B sonar:sonar \
            -Dsonar.projectKey=pjrdantas_projeto-piloto \
            -Dsonar.organization=pjrdantas \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.branch.name=${{ github.ref_name }}

      - name: Check Quality Gate (via SonarCloud API)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e
          REPORT_TASK="target/sonar/report-task.txt"

          if [ ! -f "$REPORT_TASK" ]; then
            echo "ERROR: $REPORT_TASK not found"
            ls -la target || true
            ls -la target/sonar || true
            exit 1
          fi

          CE_TASK_URL="$(grep -E '^ceTaskUrl=' "$REPORT_TASK" | cut -d'=' -f2-)"
          if [ -z "$CE_TASK_URL" ]; then
            echo "ERROR: ceTaskUrl not found in $REPORT_TASK"
            cat "$REPORT_TASK"
            exit 1
          fi

          for i in $(seq 1 60); do
            JSON="$(curl -sS -u "${SONAR_TOKEN}:" "$CE_TASK_URL")"
            STATUS="$(echo "$JSON" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p' | head -n1)"
            ANALYSIS_ID="$(echo "$JSON" | sed -n 's/.*"analysisId":"\([^"]*\)".*/\1/p' | head -n1)"
            echo "[$i] status=$STATUS analysisId=$ANALYSIS_ID"

            if [ "$STATUS" = "SUCCESS" ] && [ -n "$ANALYSIS_ID" ]; then
              break
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "ERROR: Compute engine task ended with $STATUS"
              exit 1
            fi
            sleep 5
          done

          if [ -z "$ANALYSIS_ID" ]; then
            echo "ERROR: timed out waiting for analysisId"
            exit 1
          fi

          QG_URL="https://sonarcloud.io/api/qualitygates/project_status?analysisId=$ANALYSIS_ID"
          QG_JSON="$(curl -sS -u "${SONAR_TOKEN}:" "$QG_URL")"
          QG_STATUS="$(echo "$QG_JSON" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p' | head -n1)"
          echo "$QG_JSON"

          if [ "$QG_STATUS" != "OK" ]; then
            echo "ERROR: Quality Gate failed ($QG_STATUS)"
            exit 1
          fi

  docker-build-local:
    name: Build Docker Image Locally
    runs-on: ubuntu-latest
    needs: sonarcloud
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t projeto-piloto:latest .
          docker images | grep projeto-piloto

  deploy:
    name: Deploy Kubernetes (Manual)
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy no Kubernetes
        run: |
          kubectl apply -f k8s/nginx-config.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout restart deployment/projeto-piloto
          kubectl rollout status deployment/projeto-piloto --timeout=120s