name: CI/CD Pipeline

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ######################################################
  # FASE 1: Build + Test
  ######################################################
  build-test:
    name: Build + Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build + Test
        run: mvn -B clean verify

  ######################################################
  # FASE 2: SonarCloud + Quality Gate
  ######################################################
  sonarcloud:
    name: SonarCloud Scan + Quality Gate
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build (required for Sonar analysis)
        run: mvn -B clean verify

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=pjrdantas_projeto-piloto \
            -Dsonar.organization=pjrdantas \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.branch.name=${{ github.ref_name }}

      # Diagnóstico: deixa explícito no log se o scan gerou ou não o arquivo esperado
      - name: Debug Sonar output files
        if: always()
        run: |
          echo "=== ls -la ==="
          ls -la
          echo "=== ls -la .scannerwork (if exists) ==="
          ls -la .scannerwork || true
          echo "=== find report-task.txt ==="
          find . -maxdepth 4 -name report-task.txt -print || true

      - name: Check SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 10
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ######################################################
  # FASE 3: Docker build local
  ######################################################
  docker-build-local:
    name: Build Docker Image Locally
    runs-on: ubuntu-latest
    needs: sonarcloud

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t projeto-piloto:latest .
          docker images | grep projeto-piloto

  ######################################################
  # FASE 4: Deploy Kubernetes (Manual)
  ######################################################
  deploy:
    name: Deploy Kubernetes (Manual)
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy no Kubernetes
        run: |
          kubectl apply -f k8s/nginx-config.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout restart deployment/projeto-piloto
          kubectl rollout status deployment/projeto-piloto --timeout=120s