name: CI/CD Pipeline

# Dispara o pipeline no push para a branch develop ou manualmente
on:
  push:
    branches: ["develop"]
  workflow_dispatch:

jobs:

  ######################################################
  # FASE 1: Build + Test + SonarCloud
  ######################################################
  build-test-sonar:
    name: Build + Test + SonarCloud
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Configurar Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3️⃣ Build e Testes
      - name: Build + Test
        run: mvn -B clean verify

      # 4️⃣ SonarCloud Scan (Atualizado, sem -Dsonar.ci)
      - name: SonarCloud Scan
        run: |
          echo ">>> Rodando SonarCloud Scan"
          mvn -B sonar:sonar \
            -Dsonar.projectKey=pjrdantas_projeto-piloto \
            -Dsonar.organization=pjrdantas \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.branch.name=${{ github.ref_name }} \
            -Dsonar.skip=false

      # 5️⃣ Check Quality Gate do SonarCloud
      - name: Check SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        with:
          scanMetadataReportFile: '.scannerwork/report-task.txt'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ######################################################
  # FASE 2: Build Docker Local (não faz push ainda)
  ######################################################
  docker-build-local:
    name: Build Docker Image Locally
    needs: build-test-sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t projeto-piloto:latest .
          docker images | grep projeto-piloto

  ######################################################
  # FASE 3: Deploy Kubernetes (Manual)
  ######################################################
  deploy:
    name: Deploy Kubernetes (Manual)
    needs: build-test-sonar
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' # Só dispara manualmente

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Deploy no Kubernetes
        run: |
          kubectl apply -f k8s/nginx-config.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout restart deployment projeto-piloto