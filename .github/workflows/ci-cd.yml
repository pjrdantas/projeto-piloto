name: CI/CD Pipeline

on:
  push:
    branches: ["develop", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ######################################################
  # FASE 1: Build + Test (develop e main)
  ######################################################
  build-test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build + Test
        run: mvn -B clean verify

  ######################################################
  # FASE 2: SonarCloud + Quality Gate (somente main)
  ######################################################
  sonarcloud:
    name: SonarCloud Scan + Quality Gate (main only)
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref_name == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build (required for analysis)
        run: mvn -B clean verify

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e
          mvn -B sonar:sonar \
            -Dsonar.projectKey=pjrdantas_projeto-piloto \
            -Dsonar.organization=pjrdantas \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN}

      - name: Check SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 10
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ######################################################
  # FASE 3: Build Docker Local (somente main)
  ######################################################
  docker-build-local:
    name: Build Docker Image Locally (main only)
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.ref_name == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t projeto-piloto:latest .
          docker images | grep projeto-piloto

  ######################################################
  # FASE 4: Deploy Kubernetes (Manual, somente main)
  ######################################################
  deploy:
    name: Deploy Kubernetes (Manual)
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy no Kubernetes
        run: |
          kubectl apply -f k8s/nginx-config.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout restart deployment/projeto-piloto
          kubectl rollout status deployment/projeto-piloto --timeout=120s