name: CI/CD Pipeline

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

jobs:

  build-test-sonar:
    name: Build + Test + SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build + Test
        run: mvn -B clean verify

      - name: SonarCloud Scan
        run: |
          echo ">>> Rodando SonarCloud CI Scan"
          mvn -B sonar:sonar \
            -Dsonar.projectKey=pjrdantas_projeto-piloto \
            -Dsonar.organization=pjrdantas \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.ci=true \
            -Dsonar.branch.name=${{ github.ref_name }} \
            -Dsonar.skip=false

      - name: Check SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        with:
          scanMetadataReportFile: '.scannerwork/report-task.txt'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build-local:
    name: Build Docker Image Locally
    needs: build-test-sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t projeto-piloto:latest .
          docker images | grep projeto-piloto

  deploy:
    name: Deploy Kubernetes (Manual)
    needs: build-test-sonar
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' # Só dispara manualmente

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Deploy no Kubernetes
        run: |
          kubectl apply -f k8s/nginx-config.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout restart deployment projeto-piloto